<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RS Express Parking</title>

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/images/icon.webp" type="image/webp" />
    
    <!-- First-render resources are local so they can be discovered before React runs. -->
    <link
      rel="preload"
      href="/src/assets/fonts/urbanist-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/hero-cover.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />

    <style>
      html.tidio-hidden #tidio-chat,
      html.tidio-hidden #tidio-chat-iframe,
      html.tidio-hidden iframe[title^="Tidio"] {
        display: none !important;
        visibility: hidden !important;
      }
    </style>
    
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }

      var savedConsent = null;

      try {
        savedConsent = localStorage.getItem('cookieConsent');
      } catch (error) {}

      /*
       * Set the initial consent state before GTM loads. Returning accepted users
       * can start as granted; everyone else starts as denied.
       */
      var isAccepted = savedConsent === 'accepted';

      gtag('consent', 'default', {
        ad_storage: isAccepted ? 'granted' : 'denied',
        analytics_storage: isAccepted ? 'granted' : 'denied',
        ad_user_data: isAccepted ? 'granted' : 'denied',
        ad_personalization: isAccepted ? 'granted' : 'denied',
      });
    </script>

    <!-- Load GTM immediately, regardless of consent. Consent defaults are queued above. -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({
          'gtm.start': new Date().getTime(),
          event: 'gtm.js',
        });

        var f = d.getElementsByTagName(s)[0];
        var j = d.createElement(s);
        var dl = l !== 'dataLayer' ? '&l=' + l : '';

        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-WS75DKBQ');
    </script>

    <script>
      function grantGoogleConsent() {
        gtag('consent', 'update', {
          ad_storage: 'granted',
          analytics_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
        });

        try {
          localStorage.setItem('cookieConsent', 'accepted');
        } catch (error) {}
      }

      function denyGoogleConsent() {
        gtag('consent', 'update', {
          ad_storage: 'denied',
          analytics_storage: 'denied',
          ad_user_data: 'denied',
          ad_personalization: 'denied',
        });

        try {
          localStorage.setItem('cookieConsent', 'rejected');
        } catch (error) {}
      }

      window.addEventListener('cookie-consent-accepted', function () {
        grantGoogleConsent();
      });

      window.addEventListener('cookie-consent-rejected', function () {
        denyGoogleConsent();
      });
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        var CONSENT_KEY = 'cookieConsent';
        var TIDIO_SRC = 'https://code.tidio.co/kxnbkl9gy47kmif3wdmd59ed2elnfxto.js';
        var tidioLoaded = false;
        var interactionHandler = null;
        var fallbackTimer = null;

        function getConsentChoice() {
          try {
            return localStorage.getItem(CONSENT_KEY);
          } catch (error) {
            return null;
          }
        }

        function hasAcceptedConsent() {
          return getConsentChoice() === 'accepted';
        }

        function isAdminDashboard(pathname) {
          return pathname.indexOf('/finance-dashboard') === 0 ||
            pathname.indexOf('/blog-admin') === 0;
        }

        function clearFallbackTimer() {
          if (fallbackTimer) {
            window.clearTimeout(fallbackTimer);
            fallbackTimer = null;
          }
        }

        function removeInteractionListeners() {
          if (!interactionHandler) {
            return;
          }

          window.removeEventListener('pointerdown', interactionHandler);
          window.removeEventListener('scroll', interactionHandler);
          window.removeEventListener('keydown', interactionHandler);
          interactionHandler = null;
        }

        function loadTidio() {
          if (tidioLoaded || !hasAcceptedConsent() || isAdminDashboard(window.location.pathname)) {
            return;
          }

          tidioLoaded = true;
          removeInteractionListeners();
          clearFallbackTimer();

          var tidio = document.createElement('script');
          tidio.src = TIDIO_SRC;
          tidio.async = true;
          tidio.defer = true;
          document.body.appendChild(tidio);
        }

        function enableInteractionGate() {
          if (
            tidioLoaded ||
            interactionHandler ||
            !hasAcceptedConsent() ||
            isAdminDashboard(window.location.pathname)
          ) {
            return;
          }

          interactionHandler = function () {
            loadTidio();
          };

          window.addEventListener('pointerdown', interactionHandler, { once: true, passive: true });
          window.addEventListener('scroll', interactionHandler, { once: true, passive: true });
          window.addEventListener('keydown', interactionHandler, { once: true });

          clearFallbackTimer();
          fallbackTimer = window.setTimeout(loadTidio, 20000);
        }

        function hideTidio() {
          document.documentElement.classList.add('tidio-hidden');
          if (window.tidioChatApi) {
            window.tidioChatApi.hide();
          }
        }

        function showTidio() {
          document.documentElement.classList.remove('tidio-hidden');
          if (window.tidioChatApi) {
            window.tidioChatApi.show();
          }
        }

        function updateTidioForPath(pathname) {
          if (isAdminDashboard(pathname)) {
            removeInteractionListeners();
            clearFallbackTimer();
            hideTidio();
            return;
          }

          showTidio();
          if (hasAcceptedConsent() && !window.tidioChatApi) {
            enableInteractionGate();
          }
        }

        updateTidioForPath(window.location.pathname);

        window.addEventListener('app-route-changed', function (event) {
          var pathname = event.detail && event.detail.pathname;
          updateTidioForPath(pathname || window.location.pathname);
        });
        document.addEventListener('tidioChat-ready', function () {
          updateTidioForPath(window.location.pathname);
        });
        window.addEventListener('cookie-consent-accepted', function () {
          updateTidioForPath(window.location.pathname);
        }, { once: true });
        window.addEventListener('analytics-consent-granted', function () {
          updateTidioForPath(window.location.pathname);
        }, { once: true });
        window.addEventListener('cookie-consent-rejected', function () {
          removeInteractionListeners();
          clearFallbackTimer();
        }, { once: true });

        window.addEventListener('pagehide', function () {
          removeInteractionListeners();
          clearFallbackTimer();
        });
      })();
    </script>
  </body>
</html>
