{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
{{ block.super }}
{% if original %}
<div class="submit-row send-update-email-row">
    <input type="submit" value="Save and send update email to customer"
           name="_save_and_send_email"
           class="send-update-email-btn"
           title="Saves the booking, then emails the customer their updated details with the latest invoice attached.">
</div>
{% endif %}
{% endblock %}

{% block extrahead %}{{ block.super }}
<style>
    /* Second submit row holding the "send update email" action. Sits flush
       under the main Save row so the two read as one toolbar group. */
    .send-update-email-row {
        margin-top: -10px;
    }
    input[type="submit"].send-update-email-btn {
        float: right;
        background: #2e7d32;
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 10px 15px;
        font-weight: 600;
        cursor: pointer;
    }
    input[type="submit"].send-update-email-btn:hover,
    input[type="submit"].send-update-email-btn:focus {
        background: #256628;
        color: #fff;
    }
</style>
{% endblock %}
