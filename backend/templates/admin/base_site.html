{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
{% endblock %}


{% block branding %}
<style>
    #branding {
        display: flex;
        align-items: center;
        gap: 24px;
    }
    #branding img {
        height: 50px;
        background-color: rgba(255, 255, 255, 0.8);
        padding: 5px;
        border-radius: 5px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
    }
    #finance-dashboard-btn {
        background: #193747;
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        box-shadow: 0 2px 8px rgba(68,126,155,0.08);
        transition: background 0.2s;
        margin-left: 16px;
        display: inline-block;
    }
    #finance-dashboard-btn:hover {
        background: #20435c;
        color: #fff;
    }
</style>
<div id="branding">
    <img src="{% static 'images/logo.webp' %}" alt="Site Logo">
    {% if request.user.is_authenticated and request.user.is_superuser and not request.user.is_manager %}
        <a id="finance-dashboard-btn" href="{% url 'finance-jwt-login' %}">
            Finance Dashboard
        </a>
    {% endif %}
</div>
{% endblock %}
